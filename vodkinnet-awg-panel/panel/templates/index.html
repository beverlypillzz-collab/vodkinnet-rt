<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf" content="{{ csrf }}">
<title>AWG Panel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script>try{var t=localStorage.getItem('awg-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/routers"><span class="logo"></span><span>AWG Panel</span></a>
  <nav class="tabs" id="nav">
    <a href="#/routers" data-route="routers">Роутеры</a>
    <a href="#/overview" data-route="overview">Обзор</a>
    <a href="#/log" data-route="log">Журнал</a>
  </nav>
  <span class="spacer"></span>
  <span class="muted small ver">v{{ version }}</span>
  <button class="btn icon" id="theme" title="Тема"></button>
  <form method="post" action="/logout" class="inline"><button class="btn">Выйти</button></form>
</header>
<main id="view"></main>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
